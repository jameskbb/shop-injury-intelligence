# D-14: literal, explicit-only unplugged/plugged-in mention. Never inferred from absence; a
# negated match is discarded before scoring (see classify.py::_classify_power_state). Phrases are
# additive-only observed variants (D-14: "never add a phrase that states an omission") -- e.g.
# real narratives containing "FORGOT TO UNPLUG" are correctly NOT covered here, since that states
# an omission, not an explicit unplugged state.
power_state:
  unplugged:
    - "UNPLUGGED"
    - "WAS UNPLUGGED"
    - "HAD UNPLUGGED"
    - "UNPLUGGED THE"
  plugged_in:
    - "PLUGGED IN"
    - "STILL PLUGGED IN"
    - "WAS PLUGGED IN"
    - "WAS STILL PLUGGED"
    - "WHILE PLUGGED IN"
