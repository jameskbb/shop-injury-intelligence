# D-13/INS-01 insight-engine thresholds. Every value is documented in docs/insights.md (T-03-08).
# Every comparison in wii.analytics.insights uses these keys via inclusive `>=` comparisons on
# UNROUNDED metric values -- nothing here is duplicated as a hard-coded literal in insights.py.

# Minimum raw sample-case count (BOTH compared cells) for any comparison to be eligible.
min_raw_n: 50

# Share comparisons (severity, disproportionate, pairwise_comparison): a tool's share must be at
# least this many TIMES the baseline/other-tool's share...
share_ratio_min: 1.5
# ...AND at least this many PERCENTAGE POINTS higher (both gates required).
share_pp_min: 5.0

# burden_vs_share: (share of a severe outcome) / (share of overall burden) must be at least this.
burden_outcome_ratio_min: 1.5

# trend: |percent change| between latest-N-year and prior-N-year annual averages.
trend_pct_min: 20.0
trend_window_years: 3
# When true, the two windows' 95% CIs must not overlap for the trend to qualify.
trend_require_nonoverlapping_ci: true

# Output shaping.
max_cards: 5
min_cards_for_section: 3

# Minimum narrative-excerpt classifier confidence (consumed by 03-03's representative-case
# section, not by this plan's charts).
narrative_min_confidence: 0.70

# D-13 MECHANISM TREND consistency gate (wii.analytics.mechanism_trend). A year's weighted
# unknown-mechanism share is shown in the trend only if it stays within this many percentage
# points of the pooled 2019-latest window's own unknown share. Planning-time measurement
# (04-RESEARCH.md Metadata table, VERIFIED against committed data): all 7 committed years
# 2019-2025 fall within 1.59pp of the window average (33.73%), so 5.0 excludes no current year
# while still catching a genuinely divergent year in a future data refresh (e.g. a classifier
# regression or an undocumented schema change).
mechanism_trend_unknown_tolerance_pp: 5.0

# Minimum number of gate-passing years required before the trend chart is shown at all -- fewer
# than this shows the insufficient-years note instead.
mechanism_trend_min_years: 3

# Number of top STABLE, non-unknown/non-other mechanisms plotted as separate trend lines.
mechanism_trend_top_n: 5

# Signals uses the engine's within-kind ordering and takes turns across kinds for its cap.
# No cross-kind strength or significance score is assigned.
signals:
  candidate_pool: 200
  max_cards: 12
