# Workshop tool product-code taxonomy (D-01, D-02, D-04, D-05).
# Every in-scope code is validated against the January 2025 NEISS Product Code Comparability
# Table (pages 27-30). Codes are stored WITHOUT a leading zero, matching the raw NEISS files.
version: 1
validated_against: "2025 Comparability Table"
sources:
  comparability_table:
    url: "https://www.cpsc.gov/s3fs-public/2025-Comparability-Table-Final.pdf"
    pages: "27-30"
  coding_manual:
    url: "https://www.cpsc.gov/s3fs-public/JANUARY-2025-NEISS-CPSC-only-Coding-Manual-Rev-1.pdf"

families:
  saws: {label: "Saws", sort_order: 1}
  cutting_shaping: {label: "Cutting / Shaping", sort_order: 2}
  abrasive: {label: "Abrasive", sort_order: 3}
  drilling_fastening: {label: "Drilling / Fastening", sort_order: 4}
  manual: {label: "Manual", sort_order: 5}

tools:
  table_saw: {label: "Bench or Table Saw", family: saws}
  circular_saw: {label: "Portable Circular Power Saw", family: saws}
