  radial_arm_saw: {label: "Radial Arm Saw", family: saws}
  jigsaw: {label: "Jigsaw", family: saws}
  reciprocating_saw: {label: "Reciprocating Saw (Sabre Saw)", family: saws}
  other_power_saw: {label: "Other Power Saw", family: saws}
  saw_unspecified: {label: "Saw, Not Specified", family: saws}
  router: {label: "Router", family: cutting_shaping}
