  lathe: {label: "Lathe", family: cutting_shaping}
  shaper: {label: "Shaper", family: cutting_shaping}
  other_power_tool: {label: "Other Power Tool", family: cutting_shaping}
  sander: {label: "Sander", family: abrasive}
  grinder_power: {label: "Power Grinder", family: abrasive}
